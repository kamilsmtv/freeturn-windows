name: Проверки

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Заглушка фронтенда для go:embed
        # Бинарь вшивает frontend/dist; для проверок содержимое неважно,
        # но каталог должен быть непустым, иначе go:embed не соберётся.
        run: mkdir -p frontend/dist && echo "<!doctype html>" > frontend/dist/index.html

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "Не отформатировано:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        # Цель проекта - Windows: проверяем именно её сборку, и с теми же
        # тегами, с какими собирается релиз.
        run: GOOS=windows go vet -tags desktop,production ./...

      - name: Тесты
        run: go test ./...

      - name: golangci-lint
        # Готовые бинари v1.64.8 собраны go1.24 и отказываются проверять модуль
        # с `go 1.25`, поэтому собираем линтер тем же тулчейном, что и проект.
        # Теги сборки берутся из .golangci.yml.
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          GOOS=windows golangci-lint run --timeout=5m

  frontend:
    name: Фронтенд
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Сборка (включает проверку типов)
        run: npm run build
        working-directory: frontend
